<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TrailNestCo">
  <!-- Dark rounded square keeps the mark legible on both light and dark tab bars -->
  <rect width="32" height="32" rx="7" fill="#0f1013"/>
  <!--
    Same silhouette as the site logo (lucide "mountain", used in the header,
    footer and homepage). Filled rather than stroked so it still reads at 16px.
    Source path is authored on a 24x24 grid: m8 3 4 8 5-5 5 15H2L8 3z
  -->
  <g transform="translate(2.8 2.8) scale(1.1)">
    <path d="m8 3 4 8 5-5 5 15H2L8 3z" fill="#c6ef37" stroke="#c6ef37" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
