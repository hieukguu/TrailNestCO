name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deploys write to public_html at the same time.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fail early if the export is empty
        run: |
          test -f out/index.html || { echo "out/index.html missing — refusing to deploy"; exit 1; }
          echo "Built $(find out -type f | wc -l) files"

      # rsync over SSH. Hostinger's FTP endpoint drops the control socket
      # intermittently, which made the FTP action unreliable.
      - name: Deploy to Hostinger via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # -a archive, -z compress, -r recursive, --delete prune removed files.
          # .well-known is excluded so Let's Encrypt renewal files survive.
          switches: -avzr --delete --exclude=.well-known/ --exclude=.ftp-deploy-sync-state.json
          path: out/
          remote_path: /home/u368940276/domains/trailnestco.com/public_html/
          remote_host: 217.196.54.198
          remote_port: 65002
          remote_user: u368940276
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
